<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Websites</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF9F6">
<link rel="icon" href="https://ahnafmohsieu.github.io/Portfolio/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Websites/styles.css">
</head>
<body>
<main id="main">
  <section class="hero shell">
    <p class="eyebrow">404</p>
    <h1>That page is not in the archive</h1>
    <p class="lede">These are static captures of three WordPress shops. A few dynamic links — filtered pagination, account actions, search results — were never captured because they only exist when PHP is running.</p>
    <p class="lede" id="nearest" hidden style="margin-top:14px"></p>
    <div class="actions" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px">
      <a class="btn btn--solid" href="/Websites/">Back to the case studies</a>
      <a class="btn" href="/Websites/nori/">NoriBD</a>
      <a class="btn" href="/Websites/bangubhozon/">Bangu Bhozon</a>
      <a class="btn" href="/Websites/cafe-neptune/">Cafe Neptune</a>
    </div>
  </section>
</main>
<script>
// If the visitor was inside one of the archives, offer that site's homepage
// instead of asking them to pick a shop from scratch.
(function () {
  var names = { nori: "NoriBD", bangubhozon: "Bangu Bhozon", "cafe-neptune": "Cafe Neptune" };
  var m = location.pathname.match(/\/(nori|bangubhozon|cafe-neptune)(?:\/|$)/);
  if (!m) return;
  var slug = m[1];
  var base = location.pathname.slice(0, m.index + 1);
  var line = document.getElementById("nearest");
  line.textContent = "You were heading into " + names[slug] + ". ";
  var link = document.createElement("a");
  link.href = base + slug + "/";
  link.textContent = "Start again at its homepage";
  line.appendChild(link);
  line.appendChild(document.createTextNode("."));
  line.hidden = false;
})();
</script>
</body>
</html>
